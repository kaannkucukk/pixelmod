name: Build Android APK & Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python and generate sprites (if script exists)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run sprite generator safely
        run: |
          if [ -f "tools/make_sprites.py" ]; then
            pip install pillow
            python tools/make_sprites.py
          elif [ -f "make_sprites.py" ]; then
            pip install pillow
            python make_sprites.py
          else
            echo "Sprite scripti bulunamadi, mevcut gorseller kullanilacak."
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Download Godot 4.3
        run: |
          wget -q https://github.com
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

      - name: Download Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Create export presets (Android & Windows)
        run: |
          cat > export_presets.cfg << 'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter="*.json"
          exclude_filter=""
          export_path="build/pixelmod.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          keystore/debug="debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          one_click_deploy/clear_previous_install=false
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          package/unique_name="com.pixelmod.game"
          package/name="PixelMod"
          package/signed=true
          package/classify_as_game=true
          version/code=1
          version/name="1.0"

          [preset.1]
          name="Windows Desktop"
          platform="Windows Desktop"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter="*.json"
          exclude_filter=""
          export_path="build/PixelModFighter.exe"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.1.options]
          binary_format/embed_pck=true
          binary_format/architecture="x86_64"
          EOF

      - name: Import Godot project resources
        run: godot --headless --import || true

      - name: Export APK and EXE
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/pixelmod.apk
          godot --headless --export-release "Windows Desktop" build/PixelModFighter.exe

      - name: Upload Game Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PixelMod-APK-ve-EXE
          path: build/
          if-no-files-found: warn
